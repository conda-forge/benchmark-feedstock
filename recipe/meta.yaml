{% set version = "1.9.5" %}

package:
  name: benchmark
  version: {{ version }}

source:
  url: https://github.com/google/benchmark/archive/v{{ version }}.tar.gz
  sha256: 9631341c82bac4a288bef951f8b26b41f69021794184ece969f8473977eaa340
  patches:
    - arm64-output-test-timing.patch  # [win and arm64]

build:
  number: 1

requirements:
  build:
    - cmake
    - ninja
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
  host:
    - gtest  # [win and arm64]

test:
  requires:
    - {{ compiler("cxx") }}  # [win and arm64]
    - cmake  # [win and arm64]
  files:
    - consumer/  # [win and arm64]
  commands:
    # presence of shared libs
    - test -f $PREFIX/lib/libbenchmark.so                       # [linux]
    - test -f $PREFIX/lib/libbenchmark.dylib                    # [osx]
    - test -f $PREFIX/lib/libbenchmark_main.so                  # [linux]
    - test -f $PREFIX/lib/libbenchmark_main.dylib               # [osx]
    - if not exist %LIBRARY_BIN%\benchmark.dll exit 1           # [win]
    - if not exist %LIBRARY_LIB%\benchmark.lib exit 1           # [win]
    - if not exist %LIBRARY_BIN%\benchmark_main.dll exit 1      # [win]
    - if not exist %LIBRARY_LIB%\benchmark_main.lib exit 1      # [win]

    # absence of static libs (unix)
    - test ! -f $PREFIX/lib/libbenchmark.a                      # [unix]
    - test ! -f $PREFIX/lib/libbenchmark_main.a                 # [unix]

    # headers
    - test -f $PREFIX/include/benchmark/benchmark.h             # [unix]
    - if not exist %LIBRARY_INC%\benchmark\benchmark.h exit 1   # [win]
    - cmake -S consumer -B consumer-build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%LIBRARY_PREFIX%"  # [win and arm64]
    - cmake --build consumer-build  # [win and arm64]
    - consumer-build\benchmark_consumer.exe  # [win and arm64]
    - dumpbin /headers consumer-build\benchmark_consumer.exe | findstr /I /C:"AA64 machine (ARM64)"  # [win and arm64]
    - dumpbin /headers "%LIBRARY_BIN%\benchmark.dll" | findstr /I /C:"AA64 machine (ARM64)"  # [win and arm64]
    - dumpbin /headers "%LIBRARY_BIN%\benchmark_main.dll" | findstr /I /C:"AA64 machine (ARM64)"  # [win and arm64]

about:
  home: https://github.com/google/benchmark
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: A microbenchmark support library

extra:
  recipe-maintainers:
    - xhochy
    - wesm
    - pitrou
    - kszucs
    - saraedum
